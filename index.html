<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion - Connettività FWA & Ultra Fibra</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00e5ff;
            --primary-hover: #00b8d4;
            --bg-dark: #0a0d14;
            --card-bg: #121824;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .card-title i {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 229, 255, 0.02);
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--primary);
            color: #0a0d14;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .result-box {
            display: none;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-green);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        #dati-personali-section {
            display: none;
        }

        @media (max-width: 600px) {
            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ORION FWA NETWORK</h1>
        <p>Verifica la copertura e richieda l'attivazione della fibra ultraveloce</p>
    </header>

    <!-- FASE 1: Scansione Copertura -->
    <div class="card">
        <div class="card-title">
            <i class="ph-fill ph-map-pin"></i>
            1. Verifica Copertura Indirizzo
        </div>
        <div class="form-group">
            <label for="check-indirizzo">Inserisci Indirizzo Completo (es. Via Roma 10, Milano MI 20121)</label>
            <input type="text" id="check-indirizzo" placeholder="Via, Civico, Città, Provincia, CAP">
        </div>
        <button class="btn" onclick="verificaCopertura()">
            <i class="ph-bold ph-magnifying-glass"></i> Verifica Copertura
        </button>

        <div id="result-box" class="result-box">
            <div class="result-header">
                <i class="ph-fill ph-check-circle"></i>
                Copertura Ottimale Rilevata!
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem;" id="result-desc"></p>
        </div>
    </div>

    <!-- FASE 2: Modulo Richiesta Dati -->
    <div class="card" id="dati-personali-section">
        <div class="card-title">
            <i class="ph-fill ph-user-list"></i>
            2. Completa i Dati per l'Attivazione
        </div>

        <div id="dati-personali">
            <!-- Indirizzo e dettagli geografici estratti -->
            <div class="form-group">
                <label for="req-indirizzo">Indirizzo di Installazione</label>
                <input type="text" id="req-indirizzo" placeholder="Via/Piazza e Civico">
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label for="req-citta">Città</label>
                    <input type="text" id="req-citta" placeholder="Città">
                </div>
                <div class="form-group">
                    <label for="req-provincia">Provincia</label>
                    <input type="text" id="req-provincia" placeholder="Es. MI">
                </div>
                <div class="form-group">
                    <label for="req-cap">CAP</label>
                    <input type="text" id="req-cap" placeholder="00000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="req-nome">Nome</label>
                    <input type="text" id="req-nome" placeholder="Mario">
                </div>
                <div class="form-group">
                    <label for="req-cognome">Cognome</label>
                    <input type="text" id="req-cognome" placeholder="Rossi">
                </div>
            </div>

            <div class="form-group">
                <label for="req-cf">Codice Fiscale / Partita IVA</label>
                <input type="text" id="req-cf" placeholder="RSSMRA80A01H501U">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="req-email">Email</label>
                    <input type="email" id="req-email" placeholder="mario.rossi@email.it">
                </div>
                <div class="form-group">
                    <label for="req-tel">Telefono / Cellulare</label>
                    <input type="tel" id="req-tel" placeholder="+39 333 1234567">
                </div>
            </div>

            <input type="hidden" id="velocita-assegnata" value="Fino a 1 Gbps FWA">

            <button class="btn btn-submit" style="margin-top: 10px;" onclick="inviaRichiestaGestionale()">
                <i class="ph-bold ph-paper-plane-tilt"></i> Invia Richiesta al Gestionale
            </button>
        </div>
    </div>
</div>

<!-- SDK Firebase (Versione Modulare) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configurazione Firebase (sostituisci con le tue chiavi se necessario)
    const firebaseConfig = {
        databaseURL: "https://vostra-database-url.firebaseio.com"
    };

    let app, db;
    try {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        window.db = db;
        window.push = push;
        window.ref = ref;
        window.serverTimestamp = serverTimestamp;
    } catch(e) {
        console.warn("Database Firebase non configurato o in modalità demo.");
    }

    // Algoritmo di parsing e rilevamento Indirizzo, Città, Provincia e CAP
    window.estraiDatiGeografici = function(testoIndirizzo) {
        let indirizzo = testoIndirizzo.trim();
        let cap = "";
        let provincia = "";
        let citta = "";

        // Regex per CAP (5 cifre)
        const matchCap = indirizzo.match(/\b\d{5}\b/);
        if (matchCap) {
            cap = matchCap[0];
            indirizzo = indirizzo.replace(cap, '').trim();
        }

        // Regex per Provincia tra parentesi o 2 lettere maiuscole isolate (es. MI, RM, NA)
        const matchProv = indirizzo.match(/\b([A-Za-z]{2})\b$/) || indirizzo.match(/\(([A-Za-z]{2})\)/);
        if (matchProv) {
            provincia = matchProv[1].toUpperCase();
            indirizzo = indirizzo.replace(matchProv[0], '').trim();
        }

        // Separazione via virgola per Città e Indirizzo
        const parti = indirizzo.split(',').map(p => p.trim()).filter(p => p.length > 0);

        if (parti.length >= 2) {
            citta = parti.pop();
            indirizzo = parti.join(', ');
        } else if (parti.length === 1) {
            const parole = parti[0].split(' ');
            if (parole.length > 2) {
                citta = parole.pop();
                indirizzo = parole.join(' ');
            } else {
                citta = parti[0];
            }
        }

        return {
            indirizzo: indirizzo || testoIndirizzo,
            citta: citta || "Non specificata",
            provincia: provincia || "N/D",
            cap: cap || "00000"
        };
    };

    // Funzione Scansione e Popolamento Automatico
    window.verificaCopertura = function() {
        const input = document.getElementById('check-indirizzo').value.trim();
        if (!input) {
            alert("Inserisci un indirizzo per verificare la copertura.");
            return;
        }

        // Estrazione dati geografici
        const geo = window.estraiDatiGeografici(input);

        // Popolamento automatico campi
        document.getElementById('req-indirizzo').value = geo.indirizzo;
        document.getElementById('req-citta').value = geo.citta;
        document.getElementById('req-provincia').value = geo.provincia;
        document.getElementById('req-cap').value = geo.cap;

        // Feedback Visivo
        const resultBox = document.getElementById('result-box');
        const resultDesc = document.getElementById('result-desc');
        resultDesc.innerHTML = `L'indirizzo <strong>${geo.indirizzo} (${geo.citta})</strong> è raggiunto dalla rete Orion FWA fino a <strong>1 Gbps</strong>.`;
        resultBox.style.display = 'block';

        // Mostra modulo compilazione
        document.getElementById('dati-personali-section').style.display = 'block';
        document.getElementById('dati-personali-section').scrollIntoView({ behavior: 'smooth' });
    };

    // Invia i dati completi a Firebase per l'ERP
    window.inviaRichiestaGestionale = async function() {
        const indirizzo = document.getElementById('req-indirizzo').value.trim();
        const citta = document.getElementById('req-citta').value.trim();
        const provincia = document.getElementById('req-provincia').value.trim();
        const cap = document.getElementById('req-cap').value.trim();
        const nome = document.getElementById('req-nome').value.trim();
        const cognome = document.getElementById('req-cognome').value.trim();
        const cf = document.getElementById('req-cf').value.trim();
        const email = document.getElementById('req-email').value.trim();
        const tel = document.getElementById('req-tel').value.trim();
        const velocita = document.getElementById('velocita-assegnata').value;

        if (!nome || !cognome || !cf || !email || !tel || !indirizzo) {
            alert("Compila tutti i campi obbligatori del modulo.");
            return;
        }

        const btn = document.querySelector('.btn-submit');
        btn.innerHTML = '<i class="ph-bold ph-spinner spinner"></i> Invio in corso...';
        btn.style.pointerEvents = "none";

        // Costruzione Oggetto Dati Completo per Firebase & ERP
        const dataObj = {
            cliente: `${nome} ${cognome}`,
            nome: nome,
            cognome: cognome,
            ragioneSociale: cf,
            cf: cf,
            email: email,
            telefono: tel,
            indirizzo: indirizzo,
            citta: citta,
            provincia: provincia,
            cap: cap,
            indirizzoCompleto: `${indirizzo}, ${cap} ${citta} (${provincia})`,
            velocita: velocita,
            servizio: "Orion FWA",
            importo: "29,90 €/mese",
            stato: "Nuovo",
            timestamp: window.serverTimestamp ? window.serverTimestamp() : Date.now()
        };

        if (!window.db) {
            alert("Inviato con successo (Modalità Test Locale).\n\nDati preparati per l'ERP:\n" + JSON.stringify(dataObj, null, 2));
            btn.innerHTML = '<i class="ph-bold ph-check"></i> Richiesta Inviata';
            return;
        }

        try {
            // Salva nel nodo 'ordini' e 'richieste-servizi'
            await window.push(window.ref(window.db, 'ordini'), dataObj);
            await window.push(window.ref(window.db, 'richieste-servizi'), dataObj);

            document.getElementById('dati-personali').innerHTML = `
                <div style="text-align:center; padding: 30px; border: 1px solid var(--primary); border-radius: 12px; background: rgba(0, 229, 255, 0.05);">
                    <i class="ph-fill ph-check-circle" style="color: var(--primary); font-size: 48px; margin-bottom: 12px;"></i>
                    <h3 style="color:#fff; margin-bottom: 8px;">Richiesta Inviata con Successo!</h3>
                    <p style="color:var(--text-muted);">L'ordine è stato registrato nel gestionale. Un nostro tecnico ti contatterà a breve.</p>
                </div>`;
        } catch (error) {
            console.error("Errore Firebase:", error);
            alert("Si è verificato un errore durante l'invio. Riprova.");
            btn.innerHTML = 'Invia Richiesta al Gestionale';
            btn.style.pointerEvents = "auto";
        }
    };
</script>

</body>
</html>
